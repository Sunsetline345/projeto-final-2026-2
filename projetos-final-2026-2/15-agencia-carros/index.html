<!DOCTYPE html>
<!-- DriveZone - Agência de Carros — Catálogo com filtros (JavaScript) -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DriveZone - Agência de Carros</title>
  <meta name="description" content="Catálogo de carros com filtros (JS)." />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .filtros { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:30px; }
    .filtro-btn {
      padding:10px 18px; border:2px solid var(--primary); background:#fff;
      color:var(--primary); border-radius:999px; cursor:pointer; font-weight:600;
      transition: all .2s;
    }
    .filtro-btn:hover, .filtro-btn.ativo { background:var(--primary); color:#fff; }
    .catalogo { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; }
    .item-card {
      background:#fff; border-radius:var(--radius); padding:20px;
      box-shadow:var(--shadow); text-align:center;
    }
    .item-card .img { font-size:4rem; margin-bottom:10px; }
    .item-card .preco { color:var(--primary); font-weight:800; font-size:1.2rem; margin-top:8px; }
    .vazio { text-align:center; color:var(--muted); padding:40px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav">
      <div class="logo">🚗 DriveZone - Agência de Carros</div>
      <button class="menu-toggle" aria-label="Menu">☰</button>
      <ul id="menu">
        <li><a href="#inicio">Início</a></li>
        <li><a href="#catalogo">Catálogo</a></li>
        <li><a href="#contato">Contato</a></li>
      </ul>
    </div>
  </header>

  <section class="hero" id="inicio">
    <h1>DriveZone - Agência de Carros</h1>
    <p>Catálogo de carros com filtros (JS).</p>
    <a href="#catalogo" class="btn">Explorar</a>
  </section>

  <section id="catalogo">
    <div class="container">
      <h2>Catálogo</h2>
      <p class="subtitle">Use os filtros para encontrar o ideal</p>
      <div class="filtros" id="filtros"><button class="filtro-btn" data-filtro="Todos">Todos</button><button class="filtro-btn" data-filtro="Sedan">Sedan</button><button class="filtro-btn" data-filtro="SUV">SUV</button><button class="filtro-btn" data-filtro="Hatch">Hatch</button><button class="filtro-btn" data-filtro="Picape">Picape</button></div>
      <div class="catalogo" id="lista"></div>
    </div>
  </section>

  <footer><p>© <span id="ano"></span> DriveZone - Agência de Carros</p></footer>

  <!-- Dados do catálogo embarcados (em projetos reais viria de uma API) -->
  <script>
    window.ITENS = [{"nome": "Honda Civic 2022", "categoria": "Sedan", "preco": 135000, "emoji": "🚗"}, {"nome": "Jeep Compass 2023", "categoria": "SUV", "preco": 189000, "emoji": "🚙"}, {"nome": "VW Gol 2020", "categoria": "Hatch", "preco": 62000, "emoji": "🚘"}, {"nome": "Toyota Hilux 2021", "categoria": "Picape", "preco": 245000, "emoji": "🛻"}, {"nome": "Fiat Mobi 2022", "categoria": "Hatch", "preco": 58000, "emoji": "🚘"}, {"nome": "Chevrolet Onix 2023", "categoria": "Hatch", "preco": 78000, "emoji": "🚗"}, {"nome": "Renault Duster 2022", "categoria": "SUV", "preco": 112000, "emoji": "🚙"}, {"nome": "Ford Ranger 2023", "categoria": "Picape", "preco": 260000, "emoji": "🛻"}];
    window.LABEL_PRECO = "R$";
  </script>
  <script src="script.js"></script>
</body>
</html>
